# Company career boards to scan. `ats` is one of greenhouse | lever | ashby, `token` is the slug in the
# board URL (boards.greenhouse.io/<token>, jobs.lever.co/<token>, jobs.ashbyhq.com/<token>).
# Run `jobhunt check-companies` to verify tokens and see how many open roles each board has.
# Add your own targets freely -- this list is a starting point biased toward AI-forward employers
# that hire in the SF Bay Area, Austin, or remote-in-US.

