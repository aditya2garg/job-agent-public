# H-1B sponsorship overrides. Company-level history comes from DOL LCA disclosure data
# (`jobhunt h1b-update`); the posting text is checked separately for every job.
#
# aliases: DOL files use legal entity names. Map a company's display name (as it appears on the
#          posting) to employer-name prefixes to sum filings across entities.
# known_sponsors / known_no_sponsorship: force a company's status (from your own knowledge or
#          a recruiter). Names are matched after normalising punctuation and suffixes like Inc/LLC.

aliases:
  Meta: [meta platforms, facebook]
  Google: [google, alphabet]
  Amazon: [amazon com services, amazon web services, amazon data services, amazon dev center, amazon development center, amazon corporate, amazon fulfillment, annapurna labs, amazon]
