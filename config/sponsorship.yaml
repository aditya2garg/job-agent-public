  NVIDIA: [nvidia]
  Uber: [uber technologies, uber]
  Salesforce: [salesforce, slack technologies, tableau software]
  Adobe: [adobe]
  OpenAI: [openai opco, openai]
  Anthropic: [anthropic]
  Block: [block, square]
  Scale AI: [scale ai]
  Cursor (Anysphere): [anysphere]
