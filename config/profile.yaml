# Resume proof points. Matched to each job's themes to produce tailored talking points.
evidence:
  - id: agentic_platform
    themes: [agents, mcp, llm, tool_calling, llm_apis, genai, kubernetes]
    statement: "Architected a production agentic AI platform (Python, Kubernetes) used across the organization; tracked accuracy on a large weekly prompt set; integrated multiple LLM providers through MCP for tool-calling and structured reasoning."
  - id: snowflake_agents
    themes: [text_to_sql, semantic_layer, snowflake, agents, data_modeling]
    statement: "Built an intent-based routing system and migrated legacy semantic models into dynamic semantic views; deployed multiple Snowflake Agents that autonomously query semantic views and skills."
  - id: guardrails_hitl
    themes: [guardrails, hitl, llm_evals, security_compliance, agents]
    statement: "Designed guardrails and least-privilege compliance controls, YAML-driven fallback for low-confidence responses, and a human-in-the-loop feedback loop that refines agent reasoning."
  - id: observability
    themes: [observability, llm_evals, agents, tool_calling, ci_cd]
    statement: "Instrumented agent observability via a Slack-Bolt daemon across many releases: function calling, response streaming, centralized logging of full request/response payloads, routing paths, user feedback and errors."
  - id: rag_pipeline
    themes: [rag, embeddings, vector_db, agent_frameworks, nlp]
    statement: "Mentored a senior engineer on a LangChain RAG pipeline over a claims library, improving retrieval accuracy and cutting latency."
  - id: marketing_analytics
    themes: [sql, airflow, python, etl, bi_tools, statistics]
    statement: "Built Airflow/Python/SQL pipelines for growth, engagement and retention metrics that informed marketing budget decisions, increasing applies and lowering CPA."
  - id: finance_data_platform
    themes: [etl, data_warehouse, data_governance, rest_api, data_modeling, aws, gcp, azure]
    statement: "At Employer B, built IICS/REST/JDBC ETL for the Finance system and migrated legacy data to a central warehouse, improving latency, cost, accuracy and PII security."
  - id: cloud_cost
    themes: [aws, gcp, azure, observability, mlops, security_compliance]
    statement: "Detected a DDoS attack on the ML-Ops platform and reduced monthly cloud spend across AWS/Azure/GCP."
  - id: nlp_scraping
    themes: [nlp, python, ml_general, etl]
    statement: "Scraped a large company dataset (Selenium, LinkedIn API) with fuzzy matching and NER; applied KNN clustering to surface new clients."
  - id: analytics_leadership
    themes: [bi_tools, sql, data_modeling, statistics]
    statement: "Led analytics engineering for executive stakeholders: KPI reporting, COGS forecasting, MBR/QBR dashboards in Tableau."

# Known gaps -- used in red-flag messaging. Not used for scoring directly (proficiency does that).
known_gaps:
  - "No model training / fine-tuning / PyTorch experience (JDs that need this are real gaps)"
  - "No Java / Go / Rust / C++ production experience"
  - "Limited dedicated AI-engineering tenure"
