# Candidate profile, hand-derived from the candidate's resume. Proficiency is honest, not aspirational:
#   1.0 = production expert, recent   0.8 = strong   0.55 = working / adjacent
#   0.3 = familiar / transferable     0 = none
# Keys are canonical skill ids from jobhunt/taxonomy.py. Anything not listed counts as 0.
# Edit freely: scores update on the next `jobhunt score`.

name: Sample Candidate
headline: AI Engineer (agentic platforms, MCP, RAG) with a data / analytics engineering foundation
